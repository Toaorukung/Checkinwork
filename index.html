<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Check-IN Work</title>
    <link rel="icon" type="image/png"
        href="https://shared.fastly.steamstatic.com/community_assets/images/items/2861720/0f9367f89fad6b92c96b686442d61bcb86d627f5.gif">
    <link href="style.css" rel="stylesheet" type="text/css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"
        integrity="sha256-9zljDKpE/mQxmaR4V2cGVaQ7arF3CcXxarvgr7Sj8Uc=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body class="bg-dark">
    <header>
        <div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
            <div class="progress"></div>
        </div>
    </header>

    <main class="home p-3 text-primary-emphasis border border-primary-subtle rounded-3">
        <video autoplay muted loop id="myBackgroundVideo" playsinline webkit-playsinline style="opacity:0.5;">
            <source
                src="https://shared.fastly.steamstatic.com/community_assets/images/items/2861720/124bf94415accfef96f86cbbe566e42374d53b76.webm"
                type="video/webm">
        </video>


        <div class="col-12 col-md-12 text-center mb-1 position-relative">
            <img class="rounded-3 border border-danger border-3 border-opacity-50 imgpro" height="150"
                src="https://shared.fastly.steamstatic.com/community_assets/images/items/2861720/0f9367f89fad6b92c96b686442d61bcb86d627f5.gif"
                alt="">
            <img class="position-absolute top-0 start-50 translate-middle-x" height="165"
                src="https://shared.fastly.steamstatic.com/community_assets/images/items/2861720/fc0fc2ac8d4ade722f15d3f720817d942fd58aaa.png"
                alt="">
            <p class="name mb-2 mt-3 fw-bold fs-4 text-white">ทดสอบ</p>
            <p class="location fw-bold fs-5 text-white">📍Location <span class="lat"></span>,<span class="lng"></span>
            </p>
            <button class="btn btn-danger w-50 h-100 btnGetLocation">📍 ลองดึงตำแหน่งอีกครั้ง</button>
        </div>
        <div class="col-12 mb-1 text-center">
            <p id="status" class="fs-4 fw-bold text-white mb-2">กำลังโหลด LIFF SDK...</p>
            <div class="container">
                <video id="video" autoplay muted playsinline class="img-fluid rounded-3 bg-black mx-auto"
                    style="transform: scaleX(-1);"></video>
                <canvas id="canvas" class="img-fluid rounded-3 bg-black  mx-auto"></canvas>
            </div>
            <button class="btn btn-warning btn-lg mt-4 w-50 h-100 refreshButton">🔁 เริ่มสแกนใหม่</button>
            <button class="btn btn-primary btn-lg mt-2 mb-5 w-50 h-100 save">บันทึกเข้างาน</button>
        </div>
    </main>

    <script src="link.js"></script>
    <script src="script.js"></script>
    <script src="functionlist.js"></script>
</body>

</html>
